<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agent Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gate">
    <form onsubmit="event.preventDefault();unlock()">
      <input type="password" id="gateInput" placeholder="password" autocomplete="off">
      <button type="submit">Enter</button>
    </form>
    <div class="hint">enter password</div>
  </div>

  <header>
    <div class="dot" id="dot"></div>
    <h1>Agent Chat</h1>
    <div class="status" id="status" style="display:none">
      <div class="model" id="model"></div>
      <div id="ctx"></div>
    </div>
    <input class="nick" id="nickInput" placeholder="nick" maxlength="20" onchange="saveNick(this.value)">
  </header>

  <main id="chat"></main>

  <footer>
    <div class="row">
      <textarea id="input" placeholder="Send a prompt…" rows="1"></textarea>
      <button class="send" id="sendBtn" onclick="send()">Send</button>
      <button class="stop" id="stopBtn" onclick="stop()">Stop</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
