<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
  <title>Agent Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gate">
    <form onsubmit="event.preventDefault();unlock()">
      <input type="password" id="gateInput" placeholder="password" autocomplete="off">
      <button type="submit">Enter</button>
    </form>
    <div class="hint">enter password</div>
  </div>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar">
    <div class="sb-header">
      <button class="sb-new" onclick="newSession()">＋ New Chat</button>
    </div>
    <div class="sb-list" id="sessionList"></div>
  </aside>

  <div id="app">
    <header>
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="dot" id="dot"></div>
      <h1 id="chatTitle">Agent Chat</h1>
      <div class="status" id="status" style="display:none">
        <div class="model" id="model"></div>
        <div id="ctx"></div>
        <div id="cost"></div>
      </div>
      <button class="hub-btn" id="hubBtn" onclick="toggleHub()" style="display:none">⌥ <span id="hubCount"></span></button>
      <input class="nick" id="nickInput" placeholder="nick" maxlength="20" onchange="saveNick(this.value)">
    </header>

    <main id="chat"></main>

    <div id="hub-overlay" onclick="toggleHub()"></div>
    <div id="hub">
      <div class="hub-head">
        <span>Agent Hub</span>
        <button class="hub-close" onclick="toggleHub()">×</button>
      </div>
      <div class="hub-list" id="hubList"></div>
    </div>

    <footer>
      <div class="cmd-list" id="cmdList"></div>
      <div class="row">
        <textarea id="input" placeholder="Send a prompt… or / for commands" rows="1"></textarea>
        <button class="send" id="sendBtn" onclick="send()">Send</button>
        <button class="stop" id="stopBtn" onclick="stop()">Stop</button>
      </div>
    </footer>
  </div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
